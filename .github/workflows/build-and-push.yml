name: Build and Push to ECR

on:
  push:
    branches:
      - features/devops
      - main
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/**'

env:
  AWS_REGION: us-east-1
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      # Build Backend Services
      - name: Build usuario service
        run: |
          cd Backend/usuario
          mvn clean package -DskipTests

      - name: Build pedidos service
        run: |
          cd Backend/pedidos
          mvn clean package -DskipTests

      - name: Build envios service
        run: |
          cd Backend/envios
          mvn clean package -DskipTests

      - name: Build inventory service
        run: |
          cd Backend/inventory
          mvn clean package -DskipTests

      - name: Build eureka-server
        run: |
          cd Backend/eureka-server
          mvn clean package -DskipTests

      # Build and Push Frontend
      - name: Build Frontend Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/smartlogix-frontend:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-frontend:${{ github.sha }} \
                      ./Frontend

      - name: Push Frontend to ECR
        run: |
          docker push ${{ env.REGISTRY }}/smartlogix-frontend:latest
          docker push ${{ env.REGISTRY }}/smartlogix-frontend:${{ github.sha }}

      # Build and Push Backend Services
      - name: Build and Push usuario to ECR
        run: |
          docker build -f Backend/Dockerfile.backend \
                      --build-arg SERVICE_NAME=usuario \
                      --build-arg SERVICE_VERSION=1.0.0 \
                      -t ${{ env.REGISTRY }}/smartlogix-usuario:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-usuario:${{ github.sha }} \
                      ./Backend
          docker push ${{ env.REGISTRY }}/smartlogix-usuario:latest
          docker push ${{ env.REGISTRY }}/smartlogix-usuario:${{ github.sha }}

      - name: Build and Push pedidos to ECR
        run: |
          docker build -f Backend/Dockerfile.backend \
                      --build-arg SERVICE_NAME=pedidos \
                      --build-arg SERVICE_VERSION=1.0.0 \
                      -t ${{ env.REGISTRY }}/smartlogix-pedidos:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-pedidos:${{ github.sha }} \
                      ./Backend
          docker push ${{ env.REGISTRY }}/smartlogix-pedidos:latest
          docker push ${{ env.REGISTRY }}/smartlogix-pedidos:${{ github.sha }}

      - name: Build and Push envios to ECR
        run: |
          docker build -f Backend/Dockerfile.eureka \
                      -t ${{ env.REGISTRY }}/smartlogix-envios:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-envios:${{ github.sha }} \
                      ./Backend
          docker push ${{ env.REGISTRY }}/smartlogix-envios:latest
          docker push ${{ env.REGISTRY }}/smartlogix-envios:${{ github.sha }}

      - name: Build and Push inventory to ECR
        run: |
          docker build -f Backend/Dockerfile.backend \
                      --build-arg SERVICE_NAME=inventory \
                      --build-arg SERVICE_VERSION=1.0.0 \
                      -t ${{ env.REGISTRY }}/smartlogix-inventory:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-inventory:${{ github.sha }} \
                      ./Backend
          docker push ${{ env.REGISTRY }}/smartlogix-inventory:latest
          docker push ${{ env.REGISTRY }}/smartlogix-inventory:${{ github.sha }}

      - name: Build and Push eureka-server to ECR
        run: |
          docker build -f Backend/Dockerfile.eureka \
                      -t ${{ env.REGISTRY }}/smartlogix-eureka:latest \
                      -t ${{ env.REGISTRY }}/smartlogix-eureka:${{ github.sha }} \
                      ./Backend
          docker push ${{ env.REGISTRY }}/smartlogix-eureka:latest
          docker push ${{ env.REGISTRY }}/smartlogix-eureka:${{ github.sha }}

      - name: Print ECR Registry Images
        run: |
          echo "✅ Images pushed to ECR:"
          echo "  - ${{ env.REGISTRY }}/smartlogix-frontend:latest"
          echo "  - ${{ env.REGISTRY }}/smartlogix-usuario:latest"
          echo "  - ${{ env.REGISTRY }}/smartlogix-pedidos:latest"
          echo "  - ${{ env.REGISTRY }}/smartlogix-envios:latest"
          echo "  - ${{ env.REGISTRY }}/smartlogix-inventory:latest"
          echo "  - ${{ env.REGISTRY }}/smartlogix-eureka:latest"

      - name: Generate Build Report
        if: always()
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
