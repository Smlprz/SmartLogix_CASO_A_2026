version: '3.8'

services:
  app-spring:
    build:
      context: ./Backend
    container_name: smartlogix-app
    working_dir: /app
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=smartlogix_db
      - DB_USER=smartlogix
      - DB_PASSWORD=smartlogix123
    ports:
      - "8080:8080"
    networks:
      - monitoring-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Observabilidad - Loki (Logs)
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net

  # Observabilidad - Promtail (Log Forwarder)
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./logs:/var/log/spring
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring-net

  # Observabilidad - Tempo (Traces)
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - monitoring-net

  # Observabilidad - Grafana (Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
